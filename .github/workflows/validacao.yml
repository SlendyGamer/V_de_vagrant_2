# Validação incremental: cada job corresponde a um commit e só roda se os
# arquivos daquela etapa já existem no commit. Os jobs são encadeados (needs):
# uma falha em uma etapa bloqueia as seguintes. No último commit, todas as
# etapas existem e o job "final" roda o teste ponta a ponta (smoke.mjs).
name: Validação

on:
  push:
  pull_request:

jobs:
  detectar:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      runner: ${{ steps.f.outputs.runner }}
      frontend: ${{ steps.f.outputs.frontend }}
      vagrant: ${{ steps.f.outputs.vagrant }}
      tests: ${{ steps.f.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
      - id: f
        run: |
          has() { [ -f "$2" ] && echo "$1=true" || echo "$1=false"; }
          {
            has backend backend/src/controllers/ambienteController.js
            has runner runner/agent.js
            has frontend frontend/src/pages/DashboardPage.jsx
            has vagrant Vagrantfile
            has tests tests/smoke.mjs
          } | tee -a "$GITHUB_OUTPUT"

  # 1. Banco + backend
  backend:
    needs: detectar
    if: ${{ !cancelled() && needs.detectar.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: vagrantdb
      TOKEN_SECRET: segredo-de-teste
      RUNNER_TOKEN: token-de-teste
      PORT: 3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Schema aplica e é idempotente
        run: |
          mysql -h127.0.0.1 -uroot -proot < db/schema.sql
          mysql -h127.0.0.1 -uroot -proot < db/schema.sql
      - name: Dependências e sintaxe
        working-directory: backend
        run: |
          npm ci
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: API sobe, exige token e permite login
        working-directory: backend
        run: |
          node src/server.js &
          for i in $(seq 30); do curl -s localhost:3000/ >/dev/null && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3000/api/ambientes)" = 401
          curl -sf -X POST localhost:3000/api/register -H 'Content-Type: application/json' \
            -d '{"nome":"CI","email":"ci@test.com","senha":"123456"}'
          curl -sf -X POST localhost:3000/api/login -H 'Content-Type: application/json' \
            -d '{"email":"ci@test.com","senha":"123456"}' | grep -q token

  # 2. Runner agent
  runner:
    needs: [detectar, backend]
    if: ${{ !cancelled() && !failure() && needs.detectar.outputs.runner == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sintaxe e shellcheck
        run: |
          node --check runner/agent.js
          shellcheck runner/test.sh
      - name: Agent sobe e recusa requisição sem token
        run: |
          sudo RUNNER_TOKEN=token-de-teste BIND=127.0.0.1 RUNNER_DIR=/tmp/runner \
            "$(which node)" runner/agent.js &
          for i in $(seq 15); do curl -s localhost:4000/envs >/dev/null && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:4000/envs)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer token-de-teste' localhost:4000/envs)" = 200

  # 3. Frontend
  frontend:
    needs: [detectar, runner]
    if: ${{ !cancelled() && !failure() && needs.detectar.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # 4. Vagrantfile
  vagrant:
    needs: [detectar, frontend]
    if: ${{ !cancelled() && !failure() && needs.detectar.outputs.vagrant == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instala o Vagrant
        run: |
          wget -qO- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update -qq && sudo apt-get install -y -qq vagrant
      - name: vagrant validate (com .env falso)
        run: |
          printf 'DB_HOST=x\nDB_PORT=3306\nDB_USER=x\nDB_PASSWORD=x\nDB_NAME=x\nTOKEN_SECRET=x\nRUNNER_TOKEN=x\n' > .env
          vagrant validate

  # 5. Scripts de teste
  tests:
    needs: [detectar, vagrant]
    if: ${{ !cancelled() && !failure() && needs.detectar.outputs.tests == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          shellcheck tests/ambiente-demo.sh
          node --check tests/smoke.mjs

  # Validação final: só roda com todas as etapas presentes. Sobe MySQL + runner
  # (root, cgroups v2 do próprio runner do GitHub) + backend e executa o smoke.
  final:
    needs: [detectar, backend, runner, frontend, vagrant, tests]
    if: >-
      ${{ !cancelled() && !failure()
      && needs.detectar.outputs.backend == 'true'
      && needs.detectar.outputs.runner == 'true'
      && needs.detectar.outputs.frontend == 'true'
      && needs.detectar.outputs.vagrant == 'true'
      && needs.detectar.outputs.tests == 'true' }}
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Banco
        run: mysql -h127.0.0.1 -uroot -proot < db/schema.sql
      - name: Runner agent (root)
        run: |
          sudo RUNNER_TOKEN=token-de-teste BIND=127.0.0.1 RUNNER_DIR=/srv/runner \
            "$(which node)" runner/agent.js > /tmp/runner.log 2>&1 &
          for i in $(seq 15); do curl -s localhost:4000/envs >/dev/null && break; sleep 1; done
      - name: Backend
        working-directory: backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: vagrantdb
          TOKEN_SECRET: segredo-de-teste
          RUNNER_URL: http://127.0.0.1:4000
          RUNNER_TOKEN: token-de-teste
        run: |
          npm ci
          node src/server.js > /tmp/backend.log 2>&1 &
          for i in $(seq 30); do curl -s localhost:3000/ >/dev/null && break; sleep 1; done
      - name: Smoke ponta a ponta
        run: BASE=http://localhost:3000/api node tests/smoke.mjs
      - name: Logs em caso de falha
        if: failure()
        run: tail -n 50 /tmp/runner.log /tmp/backend.log
